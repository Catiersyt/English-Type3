<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>版本四 十鍵掉落</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:28px 16px;text-align:center;font-family:system-ui,'Microsoft JhengHei',sans-serif;color:#e2e8f0;background:linear-gradient(135deg,#0f172a,#1e293b 60%,#312e81)}
h1{margin:0 0 6px;background:linear-gradient(90deg,#38bdf8,#a78bfa);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:#94a3b8;margin:0 0 14px}
.panel{display:inline-block;padding:12px 18px;margin-bottom:14px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12)}
.panel b{color:#38bdf8}
#area{position:relative;height:300px;max-width:480px;margin:0 auto 12px;border-radius:16px;overflow:hidden;background:linear-gradient(#0b1220,#16233b);border:2px solid #475569}
#area::after{content:'';position:absolute;left:0;right:0;bottom:0;height:6px;background:#ef4444}
#fall{position:absolute;left:0;right:0;top:0;height:70px;line-height:70px;font-size:56px;font-weight:bold;color:#fbbf24;text-shadow:0 0 14px #f59e0b}
.stat b{color:#38bdf8;font-size:1.3rem;margin:0 10px 0 2px}
#kb{margin:14px 0}
.row{display:flex;justify-content:center;gap:6px;margin:6px 0}
.key{width:40px;height:40px;line-height:40px;border-radius:8px;font-weight:bold;background:#1e293b;border:1px solid #475569;color:#cbd5e1;transition:all .1s}
.key.on{background:#ef4444;border-color:#fecaca;color:#fff;transform:scale(1.15);box-shadow:0 0 16px #ef4444;position:relative}
.key.on::after{content:'';position:absolute;left:50%;bottom:3px;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:#fff}
button{font-size:17px;padding:10px 24px;margin:0 4px;border-radius:999px;border:0;cursor:pointer;color:#fff;background:linear-gradient(90deg,#0ea5e9,#6366f1)}
button.s{background:#475569}
button:hover{filter:brightness(1.15)}
a{color:#38bdf8;text-decoration:none;margin-left:12px}
#res{font-weight:bold;font-size:1.3rem;color:#34d399;min-height:1.6em}
</style>
</head>
<body>
<h1>⌨️ 英打遊戲版本四:十鍵掉落</h1>
<p class="sub">請切換英文輸入,使用實體鍵盤。分號是 ; 鍵</p>
<div class="panel">
  每個字母落地時間:<input type="range" id="sp" min="3" max="14" value="8"> <b id="spv">8</b> 秒<br>
  <label><input type="checkbox" id="pg"> 漸進加速(每答對三題縮短一秒,最短三秒)</label>
</div>
<div id="area"><div id="fall">?</div></div>
<p class="stat">已作答<b id="n">0</b>/10 得分<b id="sc">0</b> 落地<b id="ms">0</b></p>
<div id="kb"></div>
<p><button id="go">開始</button><button id="ps" class="s">暫停</button><a href="../index.html">← 回首頁</a></p>
<p id="res"></p>
<script>
var rows = ["QWERTYUIOP", "ASDFGHJKL;", "ZXCVBNM,./"], keys = {};
(function(){
  var kb = document.getElementById("kb");
  rows.forEach(function(r, i){
    var d = document.createElement("div");
    d.className = "row";
    d.style.marginLeft = [0, 16, 40][i] + "px";
    r.split("").forEach(function(c){
      var k = document.createElement("span");
      k.className = "key";
      k.textContent = c;
      d.appendChild(k);
      keys[c] = k;
    });
    kb.appendChild(d);
  });
})();
function light(c){
  for (var k in keys) keys[k].classList.remove("on");
  if (c && keys[c]) keys[c].classList.add("on");
}

var L = "ASDFGHJKL;", cur = null, score = 0, miss = 0;
var t = 0, dur = 8, run = false, paused = false, last = 0;

function base(){ return +sp.value; }
function upd(){
  n.textContent = score + miss;
  sc.textContent = score;
  ms.textContent = miss;
}
function nx(){
  if (score + miss >= 10){
    run = false; fall.textContent = ""; light(null);
    res.textContent = "🎉 結束!得分 " + score + "/10,落地 " + miss;
    return;
  }
  cur = L[Math.floor(Math.random() * 10)];
  fall.textContent = cur;
  fall.style.top = "0px";
  light(cur);
  t = 0;
  dur = base();
  if (pg.checked) dur = Math.max(3, base() - Math.floor(score / 3));
}
function loop(ts){
  if (run && !paused){
    var dt = (ts - last) / 1000;
    t += dt;
    if (t >= dur){ miss++; upd(); nx(); }
    else fall.style.top = (t / dur * (area.clientHeight - 70)) + "px";
  }
  last = ts;
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

go.onclick = function(){
  score = 0; miss = 0; upd();
  res.textContent = "";
  run = true; paused = false;
  ps.textContent = "暫停";
  go.textContent = "重新開始";
  nx(); go.blur();
};
function setP(p){
  if (!run) return;
  paused = p;
  ps.textContent = p ? "繼續" : "暫停";
}
ps.onclick = function(){ setP(!paused); ps.blur(); };
sp.oninput = function(){ spv.textContent = sp.value; setP(true); };
sp.onchange = function(){ sp.blur(); };
document.addEventListener("visibilitychange", function(){
  if (document.hidden) setP(true);
});
document.addEventListener("keydown", function(e){
  if (!run || paused || e.repeat) return;
  if (e.key.toLowerCase() === cur.toLowerCase()){
    score++; upd(); nx();
  }
});
</script>
</body>
</html>
